name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

jobs:
  quality:
    name: Static and build gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check source and tests
        run: bun run typecheck

      - name: Type-check TypeScript 6 compatibility
        run: bun run typecheck:ts6

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Validate levels
        run: bun run levels:validate

      - name: Check unused code
        run: bun run knip

      - name: Check architecture boundaries
        run: bun run architecture:check

      - name: Build
        run: bun run build

      - name: Check bundle guardrails
        run: bun run bundle:check

  browser:
    name: Browser gates (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: functional and visual
            script: test:e2e:fast
          - name: performance evidence
            script: test:e2e:performance
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Run browser lane
        run: bun run ${{ matrix.script }}
