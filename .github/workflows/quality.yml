name: Quality Gates

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: quality-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  id-token: none

jobs:
  quality:
    name: Static and build gates
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Type-check source and tests
        run: bun run typecheck

      - name: Type-check TypeScript 6 compatibility
        run: bun run typecheck:ts6

      - name: Lint
        run: bun run lint

      - name: Check formatting
        run: bun run format:check

      - name: Test
        run: bun run test

      - name: Validate levels
        run: bun run levels:validate

      - name: Check unused code
        run: bun run knip

      - name: Check architecture boundaries
        run: bun run architecture:check

      - name: Audit dependencies
        run: bun audit --audit-level=high

      - name: Build
        run: bun run build

      - name: Check bundle guardrails
        run: bun run bundle:check

  browser:
    name: Browser gates (${{ matrix.project }} ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: chromium-desktop
            shard: 1/2
          - project: chromium-desktop
            shard: 2/2
          - project: chromium-mobile
            shard: 1/1
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Run browser lane
        run: bunx playwright test --project=${{ matrix.project }} --shard=${{ matrix.shard }}

      - name: Upload browser test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-results-${{ strategy.job-index }}
          path: test-results/playwright-results.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-${{ strategy.job-index }}
          path: |
            test-results/
            output/campaign-backgrounds/verified/
          if-no-files-found: ignore
          retention-days: 7

  performance-gate:
    name: Gameplay update-cost gate
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Install browser test runtime
        run: bunx playwright install --with-deps chromium

      - name: Verify update cost and regression sensitivity
        run: bun run test:performance

      - name: Upload performance evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: performance-gate
          path: test-results/
          if-no-files-found: error
          retention-days: 14

  deploy-production:
    name: Deploy production
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [quality, browser, performance-gate]
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: production-deploy
      cancel-in-progress: true
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.5

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Pull Vercel environment information
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@59.1.4 pull --yes --environment=production --token="${VERCEL_TOKEN}"

      - name: Build Vercel prebuilt output
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@59.1.4 build --prod --token="${VERCEL_TOKEN}"

      - name: Check bundle budget
        run: bun run bundle:check

      - name: Deploy production to Vercel
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: bunx vercel@59.1.4 deploy --prebuilt --prod --token="${VERCEL_TOKEN}"
