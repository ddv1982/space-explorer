<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <title>Space Explorer</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23030a18'/%3E%3Cpath d='M16 4l4 12 7 7-7-1.5-1 5.5h-6l-1-5.5L5 23l7-7z' fill='%23f4fdff'/%3E%3Cpath d='M16 10l2 7h-4z' fill='%235bd8ff'/%3E%3C/svg%3E" />
  <link rel="preload" href="/fonts/orbitron.woff2" as="font" type="font/woff2" crossorigin />
  <style>
    @font-face {
      font-family: 'Orbitron';
      src: url('/fonts/orbitron.woff2') format('woff2');
      font-weight: 400 900;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('/fonts/rajdhani-600.woff2') format('woff2');
      font-weight: 400 600;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Rajdhani';
      src: url('/fonts/rajdhani-700.woff2') format('woff2');
      font-weight: 700;
      font-style: normal;
      font-display: swap;
    }
    @font-face {
      font-family: 'Share Tech Mono';
      src: url('/fonts/share-tech-mono.woff2') format('woff2');
      font-weight: 400;
      font-style: normal;
      font-display: swap;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #02040d;
    }
    body {
      position: relative;
    }
    #game-shell {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      height: 100dvh;
      padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
    }
    #game-shell::after {
      content: '';
      position: absolute;
      inset: 0;
      z-index: 1;
      pointer-events: none;
      background: radial-gradient(ellipse at center, transparent 0%, transparent 64%, rgba(1, 4, 12, 0.08) 76%, rgba(1, 3, 10, 0.36) 100%);
    }
    #game-root {
      width: 100%;
      height: 100%;
    }
    #game-root > canvas {
      display: block;
    }
    /* Shown until Phaser mounts its canvas; PreloadScene then draws the same composition. */
    #boot-splash {
      position: absolute;
      inset: 0;
      display: grid;
      place-content: center;
      justify-items: center;
      pointer-events: none;
    }
    #game-root:not(:empty) + #boot-splash {
      display: none;
    }
    #boot-splash strong {
      margin-top: -48px;
      color: #f4fdff;
      font: 700 clamp(22px, 7vw, 44px) 'Orbitron', 'Arial Black', sans-serif;
      white-space: nowrap;
      text-shadow: 0 0 18px #5bd8ff;
    }
    #boot-splash span {
      width: min(280px, 100vw - 96px);
      height: 3px;
      margin-top: 26px;
      overflow: hidden;
      background: rgba(91, 216, 255, 0.18);
    }
    #boot-splash span::after {
      content: '';
      display: block;
      width: 30%;
      height: 100%;
      background: #5bd8ff;
      animation: boot-rail 1.1s ease-in-out infinite alternate;
    }
    @keyframes boot-rail {
      to { transform: translateX(233%); }
    }
    @media (prefers-reduced-motion: reduce) {
      #boot-splash span::after { animation: none; }
    }
    #webgl-unsupported {
      position: fixed;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 32px;
      background: radial-gradient(circle at 50% 35%, #102541 0%, #050b18 44%, #02040d 100%);
      color: #eefbff;
      text-align: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      z-index: 20;
    }
    #webgl-unsupported[hidden] {
      display: none;
    }
    #webgl-unsupported > div {
      max-width: 34rem;
      padding: 28px;
      border: 1px solid #48c9ff;
      background: rgba(3, 12, 27, 0.88);
      box-shadow: 0 0 36px rgba(41, 181, 255, 0.18);
    }
    #webgl-unsupported h1 {
      margin-bottom: 12px;
      color: #71e7ff;
      font-size: clamp(1.5rem, 5vw, 2.25rem);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }
    #webgl-unsupported p {
      color: #c8d8e8;
      font-size: 1rem;
      line-height: 1.6;
    }
    .sr-only-actions {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0, 0, 0, 0);
      white-space: nowrap;
      border: 0;
    }
  </style>
</head>
<body>
  <div id="game-shell">
    <div id="game-root"></div>
    <div id="boot-splash" aria-hidden="true"><strong>SPACE EXPLORER</strong><span></span></div>
  </div>
  <main id="webgl-unsupported" role="alert" hidden>
    <div>
      <h1>WebGL Required</h1>
      <p>Space Explorer needs WebGL to render its campaign. Enable hardware acceleration or use a browser and device with WebGL support, then reload the page.</p>
    </div>
  </main>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
